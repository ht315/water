name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache debug keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - name: Generate debug keystore
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=WaterReminder, OU=Dev, O=HT315, L=Unknown, ST=Unknown, C=CN"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrinkWaterReminder
          path: app/build/outputs/apk/debug/app-debug.apk
